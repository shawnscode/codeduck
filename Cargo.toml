[package]
name = "codeduck"
version = "0.1.0"
edition = "2024"
description = "Vim-style terminal code review tool powered by Difftastic and local AI CLI subscriptions (SVN-first, Git-ready)"

[dependencies]
ansi-to-tui = "7.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "6.0"
ignore = "0.4"
ratatui = "0.29"
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.14"
thiserror = "2.0"
toml = "0.8"
toml_edit = "0.22"
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
