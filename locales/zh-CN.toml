[help]
frame_title = " Help (j/k 滚动) "
title = "codeduck — 快捷键说明"
window_title = "窗口与浏览"
window_body = """
  Tab / Ctrl-w   切换焦点（左侧列表 / 右侧 Diff）
  H / L          直接切到左侧列表 / 右侧 Diff
  J / K          滚动底部详情面板（B/I 显隐侧栏/底栏）"""
nav_title = "移动与跳转"
nav_body = """
  j / k          上下移动
  h / l / 0      折叠展开分组 / 左右滚屏并在边缘切窗 / 回行首
  n / N          下/上一个差异块（]c / [c 亦可）
  ]f / [f        下/上一个文件
  ]g / [g        下/上一个分组
  ]i / [i        下/上一个风险提示
  Ctrl-d / u     半页上下；Ctrl-f / b 整页；gg / G 顶 / 底
  / 与 ; / ,     搜索与跳转下一/上一匹配"""
ops_title = "审阅、提交、配置与命令"
ops_body = """
  d / t          切换 Diff 模式 / 切换分组与文件列表
  za / zM / zR   折叠当前组 / 全部折叠 / 全部展开
  O              打开配置与语言选择面板（:config / :settings 亦可）
  S              打开提交面板（按分组勾选文件并生成英文提交说明）
  U              回退当前选中的分组或单个文件（支持二次确认，:revert 亦可）
  c / e          添加批注 / 导出 Markdown (codeduck-review.md)
  a / P / A      分析改动 / 切换工具 / 对当前文件提问
  C / R          切换 Commit 或未提交改动 / 强刷
  :lang [code]   切换界面与 AI 语言；:ui-lang 仅切换界面语言
  :ai / :model / :effort  切换工具、模型与推理强度
  :fast-model / :fast-effort  设置 Stage 1 与提交说明的快速模型/强度
  :new-session   重置对话会话并重新分析（:reset-session 亦可）
  :ignore <pat>  添加忽略规则到 .codeduck
  :rev 123 / :wc 查看 SVN r123（或 :rev 100:120），:wc 切回未提交改动
  :ci / :ask / :export / :q  打开提交 / AI 追问 / 导出报告 / 退出"""
close_hint = "j/k 或 Ctrl-d/u 滚动；Esc / q / ? 关闭。"

