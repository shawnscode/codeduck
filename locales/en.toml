[help]
frame_title = " Help (j/k scroll) "
title = "codeduck — Keybindings & Commands"
window_title = "Panes & Layout"
window_body = """
  Tab / Ctrl-w   Toggle focus (left tree / right diff)
  H / L          Focus left tree / right diff directly
  J / K          Scroll bottom inspector (B / I toggle sidebar / inspector)"""
nav_title = "Navigation & Search"
nav_body = """
  j / k          Move up / down
  h / l / 0      Fold/expand or scroll horizontally (switch pane at edge) / col 0
  n / N          Next / previous diff hunk (also ]c / [c)
  ]f / [f        Next / previous file
  ]g / [g        Next / previous AI group
  ]i / [i        Next / previous AI finding
  Ctrl-d / u     Half-page down/up; Ctrl-f / b full page; gg / G top / bottom
  / and ; / ,    Search diff and jump next / previous match"""
ops_title = "Review, Commit, Config & Commands"
ops_body = """
  d / t          Cycle diff mode / toggle AI-grouped vs flat file tree
  za / zM / zR   Toggle current group / collapse all / expand all
  O              Open Settings & Language config (:config / :settings)
  S              Open Commit modal (grouped select + AI English commit message)
  U              Revert selected group or file (double confirmation; :revert)
  c / e          Add reviewer note / export Markdown (codeduck-review.md)
  a / P / A      Re-run AI analysis / switch AI CLI / ask AI about current file
  C / R          Pick commit or uncommitted target / force refresh
  :lang [code]   Switch UI & AI language; :ui-lang switches UI language only
  :ai / :model / :effort      Switch AI provider, model, or reasoning effort
  :fast-model / :fast-effort  Set fast model/effort for Stage 1 & commit msg
  :new-session   Clear saved AI session and re-analyze (:reset-session)
  :ignore <pat>  Add ignore rule to .codeduck
  :rev 123 / :wc Inspect revision/range (:rev 100:120) or switch to uncommitted
  :ci / :ask / :export / :q   Commit / ask AI / export report / quit"""
close_hint = "j/k or Ctrl-d/u to scroll; Esc / q / ? to close."

